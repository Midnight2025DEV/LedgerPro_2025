name: Unit Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  swift-unit-tests:
    runs-on: macos-14
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Select Xcode 16.1
      run: sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
      
    - name: Verify Swift Version
      run: swift --version
      
    - name: Run Unit Tests
      run: |
        cd LedgerPro
        swift test --skip-build --skip "APIIntegrationTests" --skip "AccessibilityUITests" --skip "CategoryUITests" --skip "FileUploadUITests" --skip "PerformanceUITests" --skip "TransactionListUITests"
        
  python-unit-tests:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        
    - name: Install dependencies
      run: |
        cd LedgerPro/backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio pytest-cov
        
    - name: Run Python Tests
      run: |
        cd LedgerPro/backend
        python -m pytest -v